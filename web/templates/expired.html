<!doctype html>
<html id="expired-html" lang="{{.Lang}}">
    <head id="expired-head">
        <meta id="expired-meta-charset" charset="utf-8" />
        <meta
            id="expired-meta-viewport"
            name="viewport"
            content="width=device-width,initial-scale=1"
        />
        <title id="expired-title">{{.Title}}</title>
  <link rel="icon" href="/brand/favicon">
        <link
            id="expired-share-tech-mono-font"
            rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap"
        />
        <link
            id="expired-font-awesome"
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
        />
        <link id="expired-stylesheet" rel="stylesheet" href="/static/app.css" />
    </head>
    <body id="expired-body">
        <main id="expired-main" class="page narrow reveal-warning-page">
            <article id="expired-card" class="reveal-warning-card">
                <h1 id="expired-heading">
                    <i class="fa-solid fa-ban" aria-hidden="true"></i> {{call .T
                    "gone_title"}}
                </h1>
                <p id="expired-message">{{call .T "gone_text"}}</p>
                <a id="expired-new-link" class="button-link" href="/"
                    >{{call .T "create_another"}}</a
                >
            </article>
        </main>
    {{template "footer" .}}
</body>
</html>
