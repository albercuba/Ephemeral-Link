{{define "brand_mark"}}{{if .LogoURL}}<img class="brand-logo" src="{{.LogoURL}}" alt="{{call .T "app_name"}}">{{else}}<img class="brand-logo" src="/static/ephemeral-link-cube-fluent.svg" alt="{{call .T "app_name"}}">{{end}}{{end}}

{{define "footer"}}
<footer class="app-footer">
    <span>{{call .T "footer_copyright"}} {{.Version}}</span>
    <nav class="footer-links">
        <a href="/privacy" target="_blank" rel="noopener noreferrer">{{call .T "privacy_link"}}</a>
        <a href="/terms" target="_blank" rel="noopener noreferrer">{{call .T "terms_link"}}</a>
    </nav>
</footer>
{{end}}
