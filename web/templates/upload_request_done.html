<!doctype html>
<html id="upload-done-html" lang="{{.Lang}}">
    <head id="upload-done-head">
        <meta id="upload-done-meta-charset" charset="utf-8" />
        <meta
            id="upload-done-meta-viewport"
            name="viewport"
            content="width=device-width,initial-scale=1"
        />
        <title id="upload-done-title">{{.Title}}</title>
  {{if .LogoURL}}<link rel="icon" href="/brand/favicon">{{end}}

        <link
            id="upload-done-stylesheet"
            rel="stylesheet"
            href="/static/app.css"
        />
    </head>
    <body id="upload-done-body">
        <main id="upload-done-main" class="page narrow reveal-warning-page">
            <article id="upload-done-card" class="reveal-warning-card">
                <h1 id="upload-done-heading">
                    <i class="fa-solid fa-check" aria-hidden="true"></i> {{call
                    .T "upload_complete_title"}}
                </h1>
                <p id="upload-done-message">
                    {{call .T "upload_complete_text"}}
                </p>
            </article>
        </main>
    {{template "footer" .}}
</body>
</html>
