<!doctype html>
<html id="secret-revealed-html" lang="{{.Lang}}">
<head id="secret-revealed-head">
  <meta id="secret-revealed-meta-charset" charset="utf-8">
  <meta id="secret-revealed-meta-viewport" name="viewport" content="width=device-width,initial-scale=1">
  <title id="secret-revealed-title">{{.Title}}</title>
  <link rel="icon" href="/brand/favicon">
  <link id="secret-revealed-stylesheet" rel="stylesheet" href="/static/app.css">
  <script id="secret-revealed-script" src="/static/app.js" defer></script>
</head>
<body id="secret-revealed-body">
<main id="secret-revealed-main" class="page narrow">
  <a id="secret-revealed-brand-link" class="brand" href="/">{{call .T "app_name"}}</a>
  <article id="secret-revealed-card" class="created-card secret-revealed-card">
    <section id="secret-revealed-status-panel" class="created-status-panel secret-revealed-status-panel">
      <div id="secret-revealed-encrypted-pill" class="encrypted-pill">{{call .T "encrypted_label"}}</div>
      <h1 id="secret-revealed-heading">{{call .T "revealed_title"}}</h1>
      <p id="secret-revealed-destroyed-notice" class="created-security-note secret-revealed-notice">{{call .T "destroyed_notice"}}</p>
    </section>
    <section id="secret-revealed-secret-panel" class="created-link-panel secret-revealed-secret-panel">
      <pre id="secret-revealed-secret" class="secret">{{.Secret}}</pre>
    </section>
    <section id="secret-revealed-actions-panel" class="created-actions-panel secret-revealed-actions-panel">
      <button id="secret-revealed-copy-secret-btn" type="button" data-copy="#secret-revealed-secret">{{call .T "copy_to_clipboard"}}</button>
    </section>
  </article>
</main>
<footer class="app-footer"><span class="footer-copy">{{call .T "footer_copyright"}} {{.Version}}</span><span class="footer-links"><a href="/privacy">{{call .T "privacy_link"}}</a><a href="/terms">{{call .T "terms_link"}}</a></span></footer>
</body>
</html>
