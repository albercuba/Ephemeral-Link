services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8080}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      STORAGE_PATH: ${STORAGE_PATH:-/app/data/storage}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_SESSION_TOKEN: ${S3_SESSION_TOKEN:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_PREFIX: ${S3_PREFIX:-ephemeral-link}
      S3_SECURE: ${S3_SECURE:-true}
      MAX_TEXT_SECRET_SIZE: ${MAX_TEXT_SECRET_SIZE:-65536}
      MAX_FILE_SIZE: ${MAX_FILE_SIZE:-10485760}
      DEFAULT_TTL_SECONDS: ${DEFAULT_TTL_SECONDS:-3600}
      MAX_TTL_SECONDS: ${MAX_TTL_SECONDS:-2592000}
      ENCRYPTION_MASTER_KEY: ${ENCRYPTION_MASTER_KEY:?Set ENCRYPTION_MASTER_KEY to a base64-encoded 32-byte key}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-60}
      ALLOWED_LANGUAGES: ${ALLOWED_LANGUAGES:-en,de}
      DEFAULT_LANGUAGE: ${DEFAULT_LANGUAGE:-en}
      SECURE_COOKIES: ${SECURE_COOKIES:-false}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      CUSTOM_DOMAINS: ${CUSTOM_DOMAINS:-}
      DEFAULT_WORKSPACE_ID: ${DEFAULT_WORKSPACE_ID:-default}
    volumes:
      - app_storage:/app/data/storage
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
  redis:
    image: valkey/valkey:8-alpine
    command: ["valkey-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
volumes:
  app_storage:
  redis_data:
