services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8080}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      STORAGE_PATH: ${STORAGE_PATH:-/app/data/storage}
      MAX_TEXT_SECRET_SIZE: ${MAX_TEXT_SECRET_SIZE:-65536}
      MAX_FILE_SIZE: ${MAX_FILE_SIZE:-10485760}
      DEFAULT_TTL_SECONDS: ${DEFAULT_TTL_SECONDS:-3600}
      MAX_TTL_SECONDS: ${MAX_TTL_SECONDS:-2592000}
      ENCRYPTION_MASTER_KEY: ${ENCRYPTION_MASTER_KEY:-base64:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-60}
      ALLOWED_LANGUAGES: ${ALLOWED_LANGUAGES:-en,de}
      DEFAULT_LANGUAGE: ${DEFAULT_LANGUAGE:-en}
      SECURE_COOKIES: ${SECURE_COOKIES:-false}
    volumes:
      - app_storage:/app/data/storage
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
  redis:
    image: valkey/valkey:8-alpine
    command: ["valkey-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
volumes:
  app_storage:
  redis_data:
